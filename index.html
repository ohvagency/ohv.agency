<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>OHV AGENCY</title>

  <!-- 파비콘 -->
  <link rel="icon" type="image/png" href="favicon.png?v=2">

  <!-- 공통 폰트 -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

  <!-- 공통 네비게이션 -->
  <link rel="stylesheet" href="navigation.css">

  <style>

    /* =====================================
       01. 기본 설정
    ===================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: #FFFFFF;
      color: #000000;
      font-family: 'Pretendard', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =====================================
       02. 메인 화면 전체 레이아웃

       상단 여백 : 95px
       좌우 여백 : 2.5%
    ===================================== */

    .home {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      padding: 95px 2.5% 40px;

      display: flex;
      flex-direction: column;
    }

    .home-content {
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }


    /* =====================================
       03. 왼쪽 그래픽 이미지

       화면 너비의 약 23%
       최대 너비 380px
       이미지 비율 4:5
    ===================================== */

    .visual {
      position: relative;
      display: block;
      width: 23vw;
      max-width: 380px;
      flex-shrink: 0;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #FFFFFF;
    }

    .visual img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;

      transition:
        opacity 0.5s ease,
        filter 0.5s ease;
    }


    /* 기본 이미지 */

    .visual .image-default {
      opacity: 1;
    }


    /* 호버 이미지 */

    .visual .image-hover {
      opacity: 0;
    }


    /* 마우스를 올렸을 때 이미지 전환 */

    @media (hover: hover) {

      .visual:hover .image-default {
        opacity: 0;
      }

      .visual:hover .image-hover {
        opacity: 1;
        filter: brightness(1.05);
      }

    }

    .visual:focus-visible .image-hover {
      opacity: 1;
    }


    /* =====================================
       04. 카테고리 리스트

       폰트 : Pretendard Bold
       크기 : 15px
       자간 : -50
    ===================================== */

    .category-list {
      display: flex;
      flex-direction: column;
      align-items: flex-start;

      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 1.3;
    }

    .category-list a {
      transition: opacity 0.2s ease;
    }

    .category-list a:hover {
      opacity: 0.4;
    }


    /* =====================================
       05. 오른쪽 하단 OHV 로고

       너비 : 화면의 25%
       최대 너비 : 400px

       크기 변경 시 width 값을 수정
    ===================================== */

    .bottom-logo {
      display: block;
      width: 25vw;
      max-width: 400px;
      height: auto;

      margin-top: auto;
      margin-left: auto;
      margin-right: 2%;

      padding-top: 35px;
    }


    /* =====================================
       06. 태블릿 화면
    ===================================== */

    @media (max-width: 1024px) {

      .visual {
        width: 30vw;
      }

      .bottom-logo {
        width: 30vw;
      }

      .category-list {
        font-size: 14px;
      }

    }


    /* =====================================
       07. 모바일 화면
    ===================================== */

    @media (max-width: 650px) {

      .home {
        padding: 80px 16px 24px;
      }

      .home-content {
        flex-direction: column;
        gap: 20px;
      }

      .visual {
        width: 65%;
        max-width: 320px;
      }

      .category-list {
        font-size: 14px;
        line-height: 1.4;
      }

      .bottom-logo {
        width: 45%;
        max-width: 220px;
        margin-right: 0;
        padding-top: 60px;
      }

    }


    /* 모션 최소화 설정 */

    @media (prefers-reduced-motion: reduce) {

      .visual img,
      .category-list a {
        transition: none;
      }

    }

  </style>
</head>

<body>

  <!-- 공통 네비게이션 -->
  <div id="site-navigation"></div>


  <main class="home">

    <div class="home-content">

      <!-- 왼쪽 브랜드 그래픽 -->

      <a class="visual" href="experience.html">

        <img
          class="image-default"
          src="home_visual.jpg"
          alt="OHV Agency Brand Identity">

        <img
          class="image-hover"
          src="feed2.jpg"
          alt=""
          aria-hidden="true">

      </a>


      <!-- 카테고리 리스트 -->

      <div class="category-list">

        <a href="experience.html">All</a>

        <a href="experience.html?category=Graphic%20Design">
          Graphic Design
        </a>

        <a href="experience.html?category=Contents">
          Contents
        </a>

        <a href="experience.html?category=Pop-up%20%26%20Exhibition">
          Pop-up & Exhibition
        </a>

        <a href="experience.html?category=Lookbook%20Retouching">
          Lookbook Retouching
        </a>

        <a href="experience.html?category=Influencer%20Marketing">
          Influencer Marketing
        </a>

        <a href="experience.html?category=Influencer%20Collaboration">
          Influencer Collaboration
        </a>

        <a href="experience.html?category=Other%20Works">
          Other Works
        </a>

      </div>

    </div>


    <!-- 오른쪽 하단 OHV 로고 -->

    <img
      class="bottom-logo"
      src="homepage%20logo.png"
      alt="OHV Agency">

  </main>


  <!-- 공통 네비게이션 기능 -->

  <script src="navigation.js"></script>

</body>
</html>
