
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
      <!-- OHV 파비콘 -->
  <link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="navigation.css">
  <title>ABOUT — OHV AGENCY</title>
  <style>
    * { box-sizing: border-box; }

body {
  margin: 0;
  background: #F1F1F1; /* 배경색 */
  color: #939393;      /* 글자색 */
  font-family: 'Pretendard', sans-serif;
}

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      padding: 0 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F1F1F1;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -2px;
    }

    nav {
      display: flex;
      gap: 32px;
    }

    nav a {
      font-size: 12px;
      letter-spacing: 1px;
    }

    nav a:hover { opacity: 0.45; }

    main {
      min-height: 100vh;
      padding: 180px 10% 100px;
    }

    .label {
      font-size: 12px;
      letter-spacing: 2px;
      color: #939393; /* 01 / About us 글자색 */

    }

    h1 {
      font-size: clamp(60px, 10vw, 140px);
      font-weight: 400;
      letter-spacing: -0.07em;
      margin: 30px 0 70px;
    }

.description {
  max-width: 900px;
  font-size: clamp(15px, 1.5vw, 18px);
  font-weight: 400;
  line-height: 2;
  letter-spacing: -0.02em;
  word-break: keep-all;
  color: #939393; /* ABOUT 소개 문구 글자색 */
}

    .description p { margin-bottom: 32px; }

    footer {
      padding: 35px 5%;
      border-top: 1px solid #eee;
      font-size: 12px;
    }

    @media (max-width: 650px) {
      header {
        height: 70px;
      }

      .logo { font-size: 24px; }

      nav { gap: 12px; }

      nav a {
        font-size: 9px;
        letter-spacing: 0;
      }

      main { padding: 150px 6% 80px; }
    }
/* 전체 폰트 Pretendard 통일 */
body, button, input, textarea, select {
  font-family: 'Pretendard', sans-serif;
}
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">ohv.</a>
<!-- 공통 네비게이션 -->
<div id="site-navigation"></div>
  </header>

  <main>
    <div class="label">01 / About us</div>

    <div class="description">
      <p class="about-description">
OHV는 감탄사 ‘OH!’에서 시작합니다. <br>
브랜드만의 매력을 발견하고, 새로운 시선으로 해석하며, 감각적인 비주얼과 마케팅으로 구현합니다.<br>
브랜딩부터 콘텐츠, 인플루언서 마케팅, 캠페인까지. 브랜드의 아이디어가 사람들의 시선을 사로잡는 순간을 만듭니다.
      </p>
    </div>
  </main>

  <footer>
    © OHV AGENCY. ALL RIGHTS RESERVED.
  </footer>
<script src="navigation.js"></script>
</body>
</html>
