
<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="navigation.css">

  <title>SELECTED EXPERIENCE — OHV AGENCY</title>

  <style>

    /* =====================================
       01. 기본 디자인
    ===================================== */

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #FFFFFF;
      color: #000000;
      font-family: 'Pretendard', sans-serif;
      -webkit-font-smoothing: antialiased;
      color-scheme: light;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    /* =====================================
       02. 전체 페이지 여백
    ===================================== */

    main {
      width: 100%;
      max-width: none;
      min-height: 100vh;
      margin: 0 auto;
      padding: 110px 4% 80px;
      background: #FFFFFF;
    }

    /* =====================================
       03. 3단 레이아웃

       왼쪽 : 카테고리
       가운데 : 프로젝트 목록
       오른쪽 : 프로젝트 상세
    ===================================== */

    .experience-layout {
      display: grid;
      grid-template-columns:
        minmax(0, 18%)
        minmax(0, 31%)
        minmax(0, 1fr);

      column-gap: 26px;
      align-items: start;
      width: 100%;
    }

    .category-column,
    .project-column,
    .detail-column {
      min-width: 0;
      padding: 0;
      margin: 0;
      border: none;
      background: transparent;
    }

    /* =====================================
       04. 카테고리 및 프로젝트 리스트
    ===================================== */

    .category-list,
    .project-list {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      margin: 0;
      padding: 0;
      border: none;
    }

    .project-item {
      width: 100%;
      margin: 0;
      padding: 0;
      border: none;
    }

    .category-button,
    .project-button {
      display: block;
      margin: 0;
      padding: 0;
      border: none;
      background: transparent;
      color: #000000;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 1.4;
      text-align: left;
      word-break: keep-all;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .category-button {
      width: auto;
    }

    .project-button {
      width: 100%;
    }

    .category-button:hover,
    .project-button:hover {
      opacity: 0.45;
    }

    .category-button.active,
    .project-button.active {
      color: #000000;
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* 마우스 클릭 시 파란색 테두리 제거 */

    .category-button:focus:not(:focus-visible),
    .project-button:focus:not(:focus-visible) {
      outline: none;
    }

    .category-button:focus-visible,
    .project-button:focus-visible {
      outline: 1px solid #000000;
      outline-offset: 2px;
    }

    /* =====================================
       05. 오른쪽 프로젝트 상세 영역
    ===================================== */

    .detail-column {
      width: 100%;
      min-height: 300px;
      background: #FFFFFF;
      color: #000000;
      font-weight: 400;
    }

    .detail-frame {
      display: block;
      width: 100%;
      min-height: 100px;
      height: 600px;
      padding: 0;
      margin: 0;
      background: #FFFFFF;
      border: 0;
      overflow: hidden;
    }

    .empty,
    .detail-empty {
      margin: 0;
      color: #000000;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.6;
    }

    footer {
      display: none;
    }

    /* =====================================
       06. 태블릿
    ===================================== */

    @media (max-width: 1024px) {

      main {
        padding: 110px 4% 80px;
      }

      .experience-layout {
        column-gap: 18px;
      }

      .category-button,
      .project-button {
        font-size: 14px;
      }

    }

    /* =====================================
       07. 모바일
    ===================================== */

    @media (max-width: 650px) {

      main {
        padding: 85px 16px 60px;
      }

      .experience-layout {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .category-column,
      .project-column,
      .detail-column {
        width: 100%;
      }

      .category-button,
      .project-button {
        font-size: 14px;
        line-height: 1.4;
      }

      .category-list,
      .project-list {
        gap: 3px;
      }

      .detail-column {
        margin-top: 8px;
      }

    }

  </style>

</head>

<body>

  <!-- 공통 네비게이션 -->

  <div id="site-navigation"></div>

  <main>

    <div class="experience-layout">

      <!-- =====================================
           왼쪽 카테고리
      ===================================== -->

      <aside class="category-column">

        <div class="category-list"
             role="group"
             aria-label="Project category">

          <button type="button"
                  class="category-button active"
                  data-filter="ALL"
                  aria-pressed="true">
            ALL
          </button>

          <button type="button"
                  class="category-button"
                  data-filter="Graphic Design"
                  aria-pressed="false">
            Graphic Design
          </button>

          <button type="button"
                  class="category-button"
                  data-filter="Contents"
                  aria-pressed="false">
            Contents
          </button>

          <button type="button"
                  class="category-button"
                  data-filter="Pop-up &amp; Exhibition"
                  aria-pressed="false">
            Pop-up &amp; Exhibition
          </button>

          <button type="button"
                  class="category-button"
                  data-filter="Lookbook Retouching"
                  aria-pressed="false">
            Lookbook Retouching
          </button>

          <button type="button"
                  class="category-button"
                  data-filter="Influencer Marketing"
                  aria-pressed="false">
            Influencer Marketing
          </button>

          <button type="button"
                  class="category-button"
                  data-filter="Influencer Collaboration"
                  aria-pressed="false">
            Influencer Collaboration
          </button>

          <button type="button"
                  class="category-button"
                  data-filter="Other Works"
                  aria-pressed="false">
            Other Works
          </button>

        </div>

      </aside>

      <!-- =====================================
           가운데 프로젝트 목록
      ===================================== -->

      <section class="project-column"
               aria-label="Project list">

        <div class="project-list"
             id="project-list">
        </div>

      </section>

      <!-- =====================================
           오른쪽 프로젝트 상세
      ===================================== -->

      <section class="detail-column"
               id="detail-column"
               aria-label="Project details">

        <iframe class="detail-frame"
                id="detail-frame"
                title="Project details"
                scrolling="no">
        </iframe>

      </section>

    </div>

  </main>

  <!-- 프로젝트 데이터 -->

  <script src="projects.js?v=3"></script>

  <script>

    /* =====================================
       08. 기본 요소
    ===================================== */

    const projectList =
      document.getElementById('project-list');

    const categoryButtons =
      document.querySelectorAll('.category-button');

    const detailFrame =
      document.getElementById('detail-frame');

    const detailColumn =
      document.getElementById('detail-column');

    let selectedProject = null;
    let selectedCategory = 'ALL';
    let detailResizeObserver = null;

    /* =====================================
       09. 프로젝트 목록 생성
    ===================================== */

    function renderProjects(category = 'ALL') {

      selectedCategory = category;

      projectList.replaceChildren();

      detailColumn.querySelectorAll('.detail-empty')
        .forEach(element => element.remove());

      const filtered = projects.filter(project =>
        category === 'ALL' ||
        project.category === category
      );

      if (filtered.length === 0) {

        const empty = document.createElement('p');

        empty.className = 'empty';
        empty.textContent = 'No projects available yet.';

        projectList.appendChild(empty);

        selectedProject = null;

        if (detailResizeObserver) {
          detailResizeObserver.disconnect();
          detailResizeObserver = null;
        }

        detailFrame.removeAttribute('src');
        detailFrame.style.display = 'none';

        return;

      }

      const existingSelection = filtered.find(project =>
        selectedProject &&
        project.id === selectedProject.id
      );

      const firstSelection =
        existingSelection || filtered[0];

      filtered.forEach(project => {

        const item = document.createElement('div');
        item.className = 'project-item';

        const button = document.createElement('button');

        button.type = 'button';
        button.className = 'project-button';
        button.textContent = project.title;
        button.dataset.projectId = project.id;

        const isActive =
          project.id === firstSelection.id;

        button.classList.toggle('active', isActive);

        button.setAttribute(
          'aria-pressed',
          String(isActive)
        );

        button.addEventListener('click', () => {
          selectProject(project);
        });

        item.appendChild(button);
        projectList.appendChild(item);

      });

      selectProject(firstSelection);

    }

    /* =====================================
       10. 프로젝트 선택
    ===================================== */

    function selectProject(project) {

      if (!project) return;

      selectedProject = project;

      document.querySelectorAll('.project-button')
        .forEach(button => {

          const active =
            button.dataset.projectId === project.id;

          button.classList.toggle('active', active);

          button.setAttribute(
            'aria-pressed',
            String(active)
          );

        });

      detailColumn.querySelectorAll('.detail-empty')
        .forEach(element => element.remove());

      if (detailResizeObserver) {
        detailResizeObserver.disconnect();
        detailResizeObserver = null;
      }

      if (!project.link) {

        detailFrame.style.display = 'none';

        const message = document.createElement('p');

        message.className = 'detail-empty';

        message.textContent =
          'Project details will be updated soon.';

        detailColumn.appendChild(message);

        return;

      }

      detailFrame.style.display = 'block';
      detailFrame.src = project.link;

    }

    /* =====================================
       11. 모든 상세 페이지 공통 디자인

       배경 : WHITE
       텍스트 : BLACK

       카테고리 : 14px / Bold
       프로젝트 제목 : 19px / Regular
       설명 : 13px / Regular
    ===================================== */

    detailFrame.addEventListener('load', () => {

      try {

        const doc = detailFrame.contentDocument;

        if (!doc || !doc.body || !doc.head) return;

        if (detailResizeObserver) {
          detailResizeObserver.disconnect();
          detailResizeObserver = null;
        }

        /* 중복 네비게이션 및 푸터 숨김 */

        const navigation =
          doc.getElementById('site-navigation');

        if (navigation) {
          navigation.style.setProperty(
            'display', 'none', 'important'
          );
        }

        const footer = doc.querySelector('footer');

        if (footer) {
          footer.style.setProperty(
            'display', 'none', 'important'
          );
        }

        const back = doc.querySelector('.back');

        if (back) {
          back.style.setProperty(
            'display', 'none', 'important'
          );
        }

        const detailMain = doc.querySelector('main');

        /* 상세 페이지 공통 CSS 적용 */

        const previousStyle =
          doc.getElementById('ohv-detail-style');

        if (previousStyle) {
          previousStyle.remove();
        }

      /* =====================================
   프로젝트 공통 디자인 불러오기

   글씨 크기, 색상, 여백을 변경할 때는
   최상위 폴더의 project.css를 수정하세요.
===================================== */

const detailStyle = doc.createElement('link');

detailStyle.id = 'ohv-detail-style';
detailStyle.rel = 'stylesheet';
detailStyle.href = new URL('project.css', window.location.href).href;

detailStyle.addEventListener('load', () => {
  updateFrameHeight();
});

doc.head.appendChild(detailStyle);

        /* =====================================
           12. 상세 페이지 높이 자동 조절
        ===================================== */

        const content = detailMain || doc.body;

        function updateFrameHeight() {

          const height = Math.ceil(
            content.getBoundingClientRect().height
          );

          detailFrame.style.height =
            Math.max(height + 5, 100) + 'px';

        }

        updateFrameHeight();

        if ('ResizeObserver' in window) {

          detailResizeObserver =
            new ResizeObserver(updateFrameHeight);

          detailResizeObserver.observe(content);

        }

        doc.querySelectorAll('img').forEach(image => {

          image.addEventListener(
            'load',
            updateFrameHeight
          );

        });

        doc.querySelectorAll('video').forEach(video => {

          video.addEventListener(
            'loadedmetadata',
            updateFrameHeight
          );

        });

        if (doc.fonts && doc.fonts.ready) {
          doc.fonts.ready.then(updateFrameHeight);
        }

      } catch (error) {

        console.warn(
          'Project detail could not be customized:',
          error
        );

      }

    });

    /* =====================================
       13. 카테고리 선택
    ===================================== */

    function selectCategory(category) {

      categoryButtons.forEach(button => {

        const active =
          button.dataset.filter === category;

        button.classList.toggle('active', active);

        button.setAttribute(
          'aria-pressed',
          String(active)
        );

      });

      renderProjects(category);

    }

    categoryButtons.forEach(button => {

      button.addEventListener('click', () => {

        selectCategory(button.dataset.filter);

      });

    });

    /* =====================================
       14. 초기 화면
    ===================================== */

    const params = new URLSearchParams(
      window.location.search
    );

    const initialCategory = params.get('category');

    const validCategory = Array.from(categoryButtons)
      .some(button =>
        button.dataset.filter === initialCategory
      );

    selectCategory(
      validCategory ? initialCategory : 'ALL'
    );

  </script>

  <script src="navigation.js"></script>

</body>
</html>
