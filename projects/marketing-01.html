
<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
      <!-- OHV 파비콘 -->
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- =====================================
       01. OHV 공통 폰트
       ===================================== -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

  <!--
    OHV 공통 네비게이션 디자인

    이 파일은 projects 폴더 안에 있기 때문에
    ../navigation.css 로 불러옵니다.
  -->
  <link rel="stylesheet" href="../navigation.css">

  <!--
    ✏️ 수정 1. 브라우저 탭 제목
    PROJECT NAME을 실제 프로젝트명으로 변경
  -->
  <title>PROJECT NAME — OHV AGENCY</title>

  <style>

    /* =====================================
       02. 기본 설정
       ===================================== */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: 'Pretendard', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =====================================
       03. 전체 페이지 영역

       max-width : 페이지 최대 너비
       padding   : 상단 / 좌우 / 하단 여백

       상단 여백은 고정 네비게이션을 고려합니다.
       ===================================== */

    main {
      max-width: 1400px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 180px 10% 120px;
    }


    /* =====================================
       04. 프로젝트 제목

       PC : 28px
       모바일 : 22px

       font-size : 글씨 크기
       margin-bottom : 제목과 설명 사이 간격
       ===================================== */

    h1 {
      font-size: 28px;
      font-weight: 400;
      letter-spacing: -0.04em;
      line-height: 1.3;
      margin: 0 0 16px;
      word-break: keep-all;
    }


    /* =====================================
       05. 프로젝트 설명

       PC : 14px
       모바일 : 13px

       두 줄 정도의 프로젝트 소개를 작성합니다.
       ===================================== */

    .description {
      max-width: 760px;
      font-size: 14px;
      line-height: 1.8;
      color: #777;
      margin: 0 0 55px;
      white-space: pre-line;
      word-break: keep-all;
    }


    /* =====================================
       06. 프로젝트 이미지 전체 영역

       gap : 이미지 줄 사이 간격

       필요에 따라 숫자를 변경할 수 있습니다.
       ===================================== */

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }


    /* =====================================
       07. 이미지 한 줄 설정

       one   : 1장
       two   : 2장
       three : 3장

       이미지 개수에 따라 자동으로 균등 배치
       ===================================== */

    .image-row {
      display: grid;
      gap: 15px;
      align-items: start;
    }

    /* 한 줄에 이미지 1장 */
    .image-row.one {
      grid-template-columns: 1fr;
    }

    /* 한 줄에 이미지 2장 */
    .image-row.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    /* 한 줄에 이미지 3장 */
    .image-row.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }


    /* =====================================
       08. 이미지 크기 설정

       width: 100% → 칸 너비에 맞춤
       height: auto → 이미지 원본 비율 유지

       이미지가 잘리지 않도록 설정했습니다.
       ===================================== */

    .image-row img {
      display: block;
      width: 100%;
      height: auto;
    }


    /* =====================================
       09. BACK TO EXPERIENCE 버튼

       클릭하면 프로젝트 목록으로 돌아갑니다.
       ===================================== */

    .back {
      display: inline-block;
      margin-top: 70px;
      font-size: 11px;
      letter-spacing: 1px;
      transition: opacity 0.2s;
    }

    .back:hover {
      opacity: 0.45;
    }


    /* =====================================
       10. 푸터
       ===================================== */

    footer {
      border-top: 1px solid #eee;
      padding: 35px 5%;
      font-size: 12px;
    }


    /* =====================================
       11. 모바일 화면 설정

       화면 너비가 650px 이하일 때 적용

       제목 : 22px
       설명 : 13px
       이미지 2장/3장 배치는 그대로 유지
       ===================================== */

    @media (max-width: 650px) {

      main {
        padding: 150px 6% 80px;
      }

      h1 {
        font-size: 22px;
      }

      .description {
        font-size: 13px;
        margin-bottom: 35px;
      }

      .gallery,
      .image-row {
        gap: 8px;
      }

      .back {
        margin-top: 60px;
      }

    }

  </style>
</head>


<body>

  <!-- =====================================
       12. OHV 공통 네비게이션

       navigation.js가 navigation.html을 불러옵니다.
       로고 및 메뉴는 공통 파일에서 관리합니다.
       ===================================== -->

  <div id="site-navigation"></div>


  <main>

    <!-- =====================================
         ✏️ 수정 2. 프로젝트 제목

         PROJECT NAME을 실제 프로젝트명으로 변경
         ===================================== -->

    <h1>PROJECT NAME</h1>


    <!-- =====================================
         ✏️ 수정 3. 프로젝트 소개

         두 줄 정도 자유롭게 작성하면 됩니다.
         아래 문구만 수정하세요.
         ===================================== -->

    <p class="description">프로젝트에 대한 간단한 소개를 입력해 주세요.
프로젝트의 핵심 내용이나 작업 방향을 두 줄 정도 작성하면 됩니다.</p>


    <!-- =====================================
         ✏️ 수정 4. 프로젝트 이미지

         이미지는 GitHub에 업로드한 뒤 추가합니다.

         이미지 저장 예시:
         images/projects/marketing-01/01.jpg

         이 HTML 파일은 projects 폴더에 있으므로
         이미지 경로 앞에 ../ 를 붙여야 합니다.

         예시:
         ../images/projects/marketing-01/01.jpg

         원하는 이미지 배치를 자유롭게 복사하세요.

         one   : 한 줄에 1장
         two   : 한 줄에 2장
         three : 한 줄에 3장

         아래 예시는 현재 주석 처리되어 있으므로
         사이트에 나타나지 않습니다.

         이미지를 업로드하면 해당 예시의
         바깥쪽 주석을 제거하고 사용하세요.
         ===================================== -->

    <div class="gallery">


      <!-- =====================================
           [이미지 1장 배치]

           사용하려면 아래 코드의
           바깥쪽 주석을 제거하세요.
           =====================================

      <div class="image-row one">
        <img
          src="../images/projects/marketing-01/01.jpg"
          alt="프로젝트 이미지 1"
          loading="lazy">
      </div>

      ===================================== -->


      <!-- =====================================
           [이미지 2장 배치]

           같은 줄에 이미지 2장이 표시됩니다.
           =====================================

      <div class="image-row two">
        <img
          src="../images/projects/marketing-01/02.jpg"
          alt="프로젝트 이미지 2"
          loading="lazy">

        <img
          src="../images/projects/marketing-01/03.jpg"
          alt="프로젝트 이미지 3"
          loading="lazy">
      </div>

      ===================================== -->


      <!-- =====================================
           [이미지 3장 배치]

           같은 줄에 이미지 3장이 표시됩니다.
           =====================================

      <div class="image-row three">
        <img
          src="../images/projects/marketing-01/04.jpg"
          alt="프로젝트 이미지 4"
          loading="lazy">

        <img
          src="../images/projects/marketing-01/05.jpg"
          alt="프로젝트 이미지 5"
          loading="lazy">

        <img
          src="../images/projects/marketing-01/06.jpg"
          alt="프로젝트 이미지 6"
          loading="lazy">
      </div>

      ===================================== -->


    </div>


    <!-- =====================================
         13. 프로젝트 목록으로 돌아가기

         ../experience.html
         → 상위 폴더의 experience.html로 이동
         ===================================== -->

    <a class="back" href="../experience.html">
      ← BACK TO EXPERIENCE
    </a>

  </main>


  <!-- =====================================
       14. OHV 푸터
       ===================================== -->

  <footer>
    © OHV AGENCY. ALL RIGHTS RESERVED.
  </footer>


  <!-- =====================================
       15. OHV 공통 네비게이션 기능

       상대 경로가 아닌 저장소 루트 경로를 사용해
       프로젝트 상세 페이지에서도
       navigation.html을 불러올 수 있도록 합니다.
       ===================================== -->

<script src="../navigation.js"></script>

</body>
</html>
