
<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- =====================================
       01. OHV 파비콘 / 폰트 / 네비게이션

       이 HTML은 projects 폴더 안에 있으므로
       공통 파일 경로 앞에 ../ 를 붙입니다.
  ===================================== -->

  <link rel="icon" type="image/png" href="../favicon.png">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

  <link rel="stylesheet" href="../navigation.css">

  <!-- ✏️ 수정 1. 프로젝트명 -->
  <title>PROJECT NAME — OHV AGENCY</title>

  <style>

    /* =====================================
       02. 기본 설정

       배경색 : #F1F1F1
       글자색 : #939393
    ===================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: #F1F1F1;
    }

    body {
      margin: 0;
      color: #939393;
      font-family: 'Pretendard', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =====================================
       03. 프로젝트 상세 페이지 영역
    ===================================== */

    main {
      max-width: 1400px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 180px 10% 120px;
      background: #F1F1F1;
    }


    /* =====================================
       04. 프로젝트 제목

       PC : 28px
       모바일 : 22px
    ===================================== */

    h1 {
      font-size: 28px;
      font-weight: 400;
      letter-spacing: -0.04em;
      line-height: 1.3;
      margin: 0 0 16px;
      word-break: keep-all;
      color: #939393;
    }


    /* =====================================
       05. 프로젝트 설명

       PC : 14px
       모바일 : 13px
    ===================================== */

    .description {
      max-width: 760px;
      font-size: 14px;
      line-height: 1.8;
      color: #939393;
      margin: 0 0 55px;
      white-space: pre-line;
      word-break: keep-all;
    }


    /* =====================================
       06. 프로젝트 콘텐츠 전체

       유튜브 영상과 이미지가
       위에서 아래로 차례대로 표시됩니다.

       gap : 콘텐츠 사이 간격
    ===================================== */

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }


    /* =====================================
       07. 유튜브 영상 임베드

       영상 비율 : 16:9

       width: 100%
       → 프로젝트 콘텐츠 너비에 맞춤

       aspect-ratio: 16 / 9
       → PC / 모바일 영상 비율 유지
    ===================================== */

    .youtube-embed {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #F1F1F1;
    }

    .youtube-embed iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }


    /* =====================================
       08. 프로젝트 이미지 배치

       one   : 한 줄에 1장
       two   : 한 줄에 2장
       three : 한 줄에 3장
    ===================================== */

    .image-row {
      display: grid;
      gap: 15px;
      align-items: start;
    }

    .image-row.one {
      grid-template-columns: 1fr;
    }

    .image-row.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .image-row.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }


    /* =====================================
       09. 이미지 크기

       원본 비율 유지
       이미지 잘림 방지
    ===================================== */

    .image-row img {
      display: block;
      width: 100%;
      height: auto;
    }


    /* =====================================
       10. BACK TO EXPERIENCE

       프로젝트 목록으로 돌아가기
    ===================================== */

    .back {
      display: inline-block;
      margin-top: 70px;
      font-size: 11px;
      letter-spacing: 1px;
      color: #939393;
      transition: opacity 0.2s;
    }

    .back:hover {
      opacity: 0.45;
    }


    /* =====================================
       11. 푸터
    ===================================== */

    footer {
      background: #F1F1F1;
      border-top: 1px solid #D8D8D8;
      padding: 35px 5%;
      font-size: 12px;
      color: #939393;
    }


    /* =====================================
       12. 모바일 화면

       화면 너비 650px 이하
    ===================================== */

    @media (max-width: 650px) {

      main {
        padding: 150px 6% 80px;
      }

      h1 {
        font-size: 22px;
      }

      .description {
        font-size: 13px;
        margin-bottom: 35px;
      }

      .gallery,
      .image-row {
        gap: 8px;
      }

      /* 유튜브 영상도 16:9 자동 유지 */

      .back {
        margin-top: 60px;
      }

    }

  </style>
</head>


<body>

  <!-- =====================================
       13. OHV 공통 네비게이션

       navigation.js가 navigation.html을 불러옵니다.
  ===================================== -->

  <div id="site-navigation"></div>


  <main>

    <!-- =====================================
         ✏️ 수정 2. 프로젝트 제목

         PROJECT NAME을 실제 제목으로 변경
    ===================================== -->

    <h1>[INFLUENCER MARKETING] 유튜버 브랜디드 콘텐츠 바이럴</h1>


    <!-- =====================================
         ✏️ 수정 3. 프로젝트 소개

         두 줄 정도 작성하면 됩니다.
    ===================================== -->

    <p class="description">시즌에 맞춰 메가 인플루언서와 협업한 유튜브 롱폼 브랜디드 콘텐츠 제작 및 확산 <br>
     인플루언서 영향력을 활용한 자연스러운 바이럴 유도로 브랜드 인지도 제고 및 상품 구매 전환 강화</p>


    <!-- =====================================
         14. 프로젝트 콘텐츠 영역

         유튜브 영상 + 이미지

         순서를 바꾸고 싶다면
         해당 블록의 위치를 변경하면 됩니다.
    ===================================== -->

    <div class="gallery">


      <!-- =====================================
           ✏️ 수정 4. 유튜브 영상

           현재 적용된 영상:
           https://www.youtube.com/watch?v=H5JiGhz3nT8

           다른 영상으로 교체하려면
           embed/ 뒤 영상 ID만 변경하세요.

           예시:
           youtube.com/watch?v=ABC123

           변경:
           youtube.com/embed/ABC123
      ===================================== -->

      <div class="youtube-embed">

        <iframe
          src="https://www.youtube.com/embed/H5JiGhz3nT8"
          title="OHV Project YouTube Video"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>

      </div>


      <!-- =====================================
           ✏️ 수정 5. 프로젝트 이미지

           이미지는 GitHub에 업로드 후 사용합니다.

           이미지 저장 예시:

           images/
             projects/
               marketing/
                 marketing01_youhee/
                   01.jpg
                   02.jpg
                   03.jpg

           실제 HTML 이미지 경로:

           ../images/projects/marketing/marketing01_youhee/01.jpg

           이미지 배치는 아래 예시를 참고하세요.

           one   : 한 줄에 1장
           two   : 한 줄에 2장
           three : 한 줄에 3장

           ※ 아래 이미지 예시는 주석 처리되어 있습니다.
           사용할 블록의 주석을 제거하세요.
      ===================================== -->


      <!-- =====================================
           [이미지 1장 배치]

           한 줄에 큰 이미지 1장
      =====================================

      <div class="image-row one">

        <img
          src="../images/projects/marketing/marketing01_youhee/01.jpg"
          alt="프로젝트 이미지 1"
          loading="lazy">

      </div>

      ===================================== -->


      <!-- =====================================
           [이미지 2장 배치]

           한 줄에 이미지 2장
      =====================================

      <div class="image-row two">

        <img
          src="../images/projects/marketing/marketing01_youhee/02.jpg"
          alt="프로젝트 이미지 2"
          loading="lazy">

        <img
          src="../images/projects/marketing/marketing01_youhee/03.jpg"
          alt="프로젝트 이미지 3"
          loading="lazy">

      </div>

      ===================================== -->


      <!-- =====================================
           [이미지 3장 배치]

           한 줄에 이미지 3장
      =====================================

      <div class="image-row three">

        <img
          src="../images/projects/marketing/marketing01_youhee/04.jpg"
          alt="프로젝트 이미지 4"
          loading="lazy">

        <img
          src="../images/projects/marketing/marketing01_youhee/05.jpg"
          alt="프로젝트 이미지 5"
          loading="lazy">

        <img
          src="../images/projects/marketing/marketing01_youhee/06.jpg"
          alt="프로젝트 이미지 6"
          loading="lazy">

      </div>

      ===================================== -->


      <!-- =====================================
           이미지 추가 방법

           1. 필요한 이미지 배치 블록 복사
           2. 주석 제거
           3. src 이미지 경로 변경
           4. 원하는 위치에 붙여넣기

           유튜브 영상 위에도 배치할 수 있습니다.
      ===================================== -->


    </div>


    <!-- =====================================
         15. 프로젝트 목록으로 돌아가기
    ===================================== -->

    <a class="back" href="../experience.html">
      ← BACK TO EXPERIENCE
    </a>

  </main>


  <!-- =====================================
       16. OHV 공통 푸터
    ===================================== -->

  <footer>
    © OHV AGENCY. ALL RIGHTS RESERVED.
  </footer>


  <!-- =====================================
       17. OHV 공통 네비게이션 기능

       projects 폴더의 상위 파일 불러오기
    ===================================== -->

  <script src="../navigation.js"></script>

</body>
</html>
