    /* =====================================
       04. 이미지 슬라이드

       이미지 위 좌우 화살표
       숫자 카운터 없음
       이미지 원본 비율 유지
    ===================================== */

    .image-slider {
      width: 100%;
      min-width: 0;
    }

    .slider-viewport {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .slider-track {
      display: flex;
      width: 100%;

      transition: transform 0.35s ease;
      will-change: transform;
    }

    .slide {
      flex: 0 0 100%;
      min-width: 0;
    }

    .slide img {
      display: block;
      width: 100%;
      height: auto;
    }


    /* =====================================
       05. 슬라이드 화살표

       이미지 위 좌우 중앙

       ✏️ left / right 숫자로
       화살표 위치 변경 가능
    ===================================== */

    .slider-prev,
    .slider-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 40px;
      height: 40px;

      padding: 0;
      border: none;
      background: transparent;

      color: #939393;

      font-size: 27px;
      font-weight: 400;
      line-height: 1;

      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .slider-prev {
      left: 10px;
    }

    .slider-next {
      right: 10px;
    }

    .slider-prev:hover,
    .slider-next:hover {
      opacity: 0.5;
    }

    .slider-prev:focus-visible,
    .slider-next:focus-visible {
      outline: 1px solid #939393;
      outline-offset: 2px;
    }

       06. 콘텐츠 하이퍼링크

       이미지 아래 링크
       유튜브 아래 링크

       07. 유튜브 임베드

       클릭해서 펼치기 기능 없음

  <!-- =====================================
       20. 이미지 슬라이드 기능

       이미지 개수 자동 인식
       좌우 화살표로 이동
       마지막 이미지 → 첫 번째 이미지
       숫자 카운터 없음
  ===================================== -->

  <script>

    document.querySelectorAll('.image-slider').forEach(slider => {

      const track = slider.querySelector('.slider-track');
      const slides = slider.querySelectorAll('.slide');

      const prev = slider.querySelector('.slider-prev');
      const next = slider.querySelector('.slider-next');
      const viewport = slider.querySelector('.slider-viewport');

      let index = 0;
      const total = slides.length;

      if (!track || !total || !prev || !next) return;


      /* 이미지 이동 */
      function updateSlider() {

        track.style.transform =
          `translateX(-${index * 100}%)`;

        /* 이미지마다 원본 비율이 다를 수 있어
           현재 이미지 높이에 맞춰 영역 조절 */

        const currentImage = slides[index].querySelector('img');

        if (currentImage) {
          const updateHeight = () => {
            const height = currentImage.getBoundingClientRect().height;
            if (height > 0) {
              viewport.style.height = `${height}px`;
            }
          };

          if (currentImage.complete) {
            updateHeight();
          } else {
            currentImage.addEventListener('load', updateHeight, {once: true});
          }
        }

      }


      /* 이전 이미지 */
      prev.addEventListener('click', () => {

        index = (index - 1 + total) % total;
        updateSlider();

      });


      /* 다음 이미지 */
      next.addEventListener('click', () => {

        index = (index + 1) % total;
        updateSlider();

      });


      /* 화면 크기 변경 시 높이 재계산 */
      window.addEventListener('resize', updateSlider);


      /* 첫 번째 이미지 표시 */
      updateSlider();

    });

  </script>
