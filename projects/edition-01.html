       01. OHV 공통 설정

       EXPERIENCE 3단 구조
       오른쪽 프로젝트 상세 페이지용
  ===================================== -->

  <style>

    /* =====================================
       02. 기본 디자인

       배경 : #F1F1F1
       글자 : #939393
       폰트 : Pretendard
    ===================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #F1F1F1;
      color: #939393;
      font-family: 'Pretendard', sans-serif;
      -webkit-font-smoothing: antialiased;
      color-scheme: light;
    }

    button,
    a {
      font-family: inherit;
      color: inherit;
    }

    a {
      text-decoration: none;
    }

    main {
      width: 100%;
      max-width: none;
      min-height: 0;
      margin: 0;
      padding: 0;
    }


    /* =====================================
       03. 프로젝트 메인 제목

       카테고리 : Bold
       프로젝트명 : Regular
    ===================================== */

    .project-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;

      column-gap: 8px;
      row-gap: 4px;

      margin: 0 0 20px;

      color: #939393;
      line-height: 1.4;
      word-break: keep-all;
    }

    .project-heading-category {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.065em;
    }

    .project-heading-title {
      font-size: 19px;
      font-weight: 400;
      letter-spacing: -0.035em;
    }


    /* =====================================
       04. 프로젝트 소개

       margin-bottom
       → 설명과 콘텐츠 사이 간격
    ===================================== */

    .description {
      max-width: 760px;
      margin: 0 0 65px;

      font-size: 13px;
      font-weight: 400;
      letter-spacing: normal;
      line-height: 1.8;

      color: #939393;

      white-space: pre-line;
      word-break: keep-all;
    }


    /* =====================================
       05. 콘텐츠 전체 영역
    ===================================== */

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }


    /* =====================================
       06. 29CM 에디션 제목

       클릭 → 펼치기
       다시 클릭 → 접기
    ===================================== */

    .content-item {
      width: 100%;
    }

    .content-toggle {
      display: inline-block;

      margin: 0;
      padding: 0;

      border: none;
      background: transparent;

      color: #939393;

      font-size: 15px;
      font-weight: 700;
      letter-spacing: normal;
      line-height: normal;

      text-align: left;
      word-break: keep-all;

      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .content-toggle:hover {
      opacity: 0.55;
    }

    .content-toggle:focus-visible {
      outline: 1px solid #939393;
      outline-offset: 4px;
    }


    /* =====================================
       07. + / − 표시

       닫힘 : +
       열림 : −
    ===================================== */

    .content-toggle::after {
      content: "+";
      display: inline-block;

      margin-left: 7px;

      font-size: 15px;
      font-weight: 400;
      letter-spacing: normal;
      line-height: 1;
    }

    .content-toggle[aria-expanded="true"]::after {
      content: "−";
    }


    /* =====================================
       08. 29CM 콘텐츠 펼치기
    ===================================== */

    .content-panel[hidden] {
      display: none;
    }

    .content-panel {
      margin-top: 14px;
    }


    /* =====================================
       09. 29CM 에디션 임베드

       외부 사이트에서 iframe을 차단하면
       페이지가 표시되지 않을 수 있습니다.
    ===================================== */

    .edition-embed {
      width: 100%;
      height: 650px;
      background: #F1F1F1;
    }

    .edition-embed iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    .external-link {
      display: inline-block;

      margin-top: 12px;

      font-size: 11px;
      font-weight: 400;

      color: #939393;
      text-decoration: none;

      transition: opacity 0.2s ease;
    }

    .external-link:hover {
      opacity: 0.55;
    }


    /* =====================================
       10. 곰송이 이미지 슬라이드

       이미지 총 9장

       이미지 위에 좌우 화살표 표시
       이미지 숫자 카운터 없음

       한 번에 이미지 1장씩
    ===================================== */

    .image-slider {
      width: 100%;
      min-width: 0;
      margin-top: 20px;
    }

    /* 이미지 및 화살표 기준 영역 */
    .slider-viewport {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #F1F1F1;
    }

    /* 이미지 가로 배열 */
    .slider-track {
      display: flex;
      width: 100%;
      align-items: flex-start;

      transition: transform 0.35s ease;
      will-change: transform;
    }

    /* 이미지 한 장 */
    .slide {
      flex: 0 0 100%;
      min-width: 0;
    }

    /* 원본 이미지 비율 유지 */
    .slide img {
      display: block;
      width: 100%;
      height: auto;
    }


    /* =====================================
       11. 이미지 위 좌우 화살표

       이미지 중앙 높이에 겹쳐서 표시

       ✏️ left / right
       → 이미지 가장자리와의 거리
    ===================================== */

    .slider-prev,
    .slider-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 40px;
      height: 40px;

      padding: 0;
      margin: 0;

      border: none;
      background: transparent;

      color: #939393;

      font-family: 'Pretendard', sans-serif;
      font-size: 27px;
      font-weight: 400;
      line-height: 1;

      cursor: pointer;

      transition: opacity 0.2s ease;
    }

    /* 이전 이미지 */
    .slider-prev {
      left: 10px;
    }

    /* 다음 이미지 */
    .slider-next {
      right: 10px;
    }

    .slider-prev:hover,
    .slider-next:hover {
      opacity: 0.5;
    }

    .slider-prev:focus-visible,
    .slider-next:focus-visible {
      outline: 1px solid #939393;
      outline-offset: 2px;
    }


    /* =====================================
       12. 유튜브 영상

       이미지 슬라이드 아래에 표시

       클릭해서 펼치는 기능 없음
       처음부터 영상 표시

       영상 비율 16:9
    ===================================== */

    .youtube-embed {
      width: 100%;
      aspect-ratio: 16 / 9;

      margin-top: 25px;

      background: #F1F1F1;
    }

    .youtube-embed iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }


    /* =====================================
       13. 일반 프로젝트 이미지 배치

       one   : 한 줄에 1장
       two   : 한 줄에 2장
       three : 한 줄에 3장

       이미지 원본 비율 유지
    ===================================== */

    .image-row {
      display: grid;
      gap: 15px;
      align-items: start;
    }

    .image-row.one {
      grid-template-columns: 1fr;
    }

    .image-row.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .image-row.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .image-row img {
      display: block;
      width: 100%;
      height: auto;
    }

  <!-- =====================================
       24. 29CM 에디션 펼치기 / 접기

       기존 기능 유지

       제목 클릭 → 펼치기
       다시 클릭 → 접기
  ===================================== -->

  <script>

    document.querySelectorAll('.content-toggle').forEach(button => {

      button.addEventListener('click', function() {

        const panel = document.getElementById(
          button.getAttribute('aria-controls')
        );

        if (!panel) return;

        const isOpen =
          button.getAttribute('aria-expanded') === 'true';

        const iframe = panel.querySelector('iframe');

        if (isOpen) {

          /* 에디션 접기 */
          panel.hidden = true;

          button.setAttribute(
            'aria-expanded',
            'false'
          );

          if (iframe) {
            iframe.removeAttribute('src');
          }

        } else {

          /* 에디션 펼치기 */
          panel.hidden = false;

          button.setAttribute(
            'aria-expanded',
            'true'
          );

          if (iframe && iframe.dataset.src) {
            iframe.src = iframe.dataset.src;
          }

        }

      });

    });

  </script>


  <!-- =====================================
       25. 곰송이 이미지 슬라이드 기능

       좌우 화살표 클릭으로 이동

       이미지 총 9장 자동 인식

       숫자 카운터 기능 제거
  ===================================== -->

  <script>

    document.querySelectorAll('.image-slider').forEach(slider => {

      const track = slider.querySelector('.slider-track');
      const slides = slider.querySelectorAll('.slide');

      const prev = slider.querySelector('.slider-prev');
      const next = slider.querySelector('.slider-next');

      let index = 0;
      const total = slides.length;

      if (!track || !total || !prev || !next) return;


      /* 이미지 위치 변경 */
      function updateSlider() {

        track.style.transform =
          `translateX(-${index * 100}%)`;

      }


      /* 이전 이미지 */
      prev.addEventListener('click', () => {

        index = (index - 1 + total) % total;

        updateSlider();

      });


      /* 다음 이미지 */
      next.addEventListener('click', () => {

        index = (index + 1) % total;

        updateSlider();

      });
