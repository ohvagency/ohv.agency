  <!-- =====================================
       15. 인스타그램 임베드 기능

       제목 클릭 → 펼치기
       다시 클릭 → 접기

       스크립트는 한 번만 추가

       새 게시물이 추가되어도
       JavaScript 수정할 필요 없음
  ===================================== -->

  <script>

    /* =====================================
       인스타그램 공식 임베드 처리
    ===================================== */

    function loadInstagramEmbeds() {

      if (
        window.instgrm &&
        window.instgrm.Embeds &&
        typeof window.instgrm.Embeds.process === 'function'
      ) {

        window.instgrm.Embeds.process();

      }

    }


    /* =====================================
       임베드 로딩 및 크기 변경 알림

       EXPERIENCE 오른쪽 iframe의
       높이 재계산을 돕는 코드
    ===================================== */

    function notifyContentResize() {

      window.dispatchEvent(
        new Event('resize')
      );

    }


    /* =====================================
       제목 클릭 기능
    ===================================== */

    document.querySelectorAll('.video-text').forEach(button => {

      button.addEventListener('click', () => {

        const panel = document.getElementById(
          button.getAttribute('aria-controls')
        );

        if (!panel) return;

        const isOpen =
          button.getAttribute('aria-expanded') === 'true';


        /* 열려 있으면 닫기 */

        if (isOpen) {

          panel.hidden = true;

          button.setAttribute(
            'aria-expanded',
            'false'
          );

        } else {

          /* 닫혀 있으면 펼치기 */

          panel.hidden = false;

          button.setAttribute(
            'aria-expanded',
            'true'
          );

          /* 인스타그램 임베드 실행 */

          loadInstagramEmbeds();

        }

        notifyContentResize();

      });

    });


    /* =====================================
       콘텐츠 크기 변경 감지

       인스타그램 임베드가 로딩되면
       높이가 달라질 수 있습니다.

       ResizeObserver를 통해
       높이 변경 감지
    ===================================== */

    if ('ResizeObserver' in window) {

      const main = document.querySelector('main');

      if (main) {

        const observer = new ResizeObserver(() => {
          notifyContentResize();
        });

        observer.observe(main);

      }

    }

  </script>

  <script

    src="https://www.instagram.com/embed.js"
    onload="loadInstagramEmbeds()">
