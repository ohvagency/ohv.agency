
<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- OHV 파비콘 -->
  <link rel="icon" type="image/png" href="favicon.png">
  
  <!-- 폰트 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

  <!-- 공통 네비게이션 -->
  <link rel="stylesheet" href="navigation.css">

  <!-- 파비콘 -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>CONTACT — OHV AGENCY</title>

  <style>

    /* 기본 설정 */
    * {
      box-sizing: border-box;
    }

body {
  margin: 0;
  background: #F1F1F1;
  color: #939393;
  font-family: 'Pretendard', sans-serif;
}

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, textarea, select {
      font-family: 'Pretendard', sans-serif;
    }

    /* CONTACT 페이지 */

    main {
      max-width: 1120px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 180px 6% 110px;
    }

    /* 페이지 제목 */

    .eyebrow {
      font-size: 11px;
      color: #777;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    /* 문의 폼 */

    form {
      max-width: 760px;
    }

    .field {
      margin-bottom: 32px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 11px;
    }

    .optional {
      color: #888;
      font-size: 11px;
    }

    input,
    select,
    textarea {
      display: block;
      width: 100%;
      padding: 14px 2px;
      border: 0;
      border-bottom: 1px solid #bbb;
      border-radius: 0;
      background: #fff;
      color: #111;
      font-size: 15px;
      outline: 0;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-bottom-color: #111;
    }

    textarea {
      min-height: 135px;
      resize: vertical;
    }

    .hint {
      font-size: 12px;
      color: #777;
      line-height: 1.7;
      margin: 18px 0 28px;
    }

    /* 전송 버튼 */

    .submit {
      border: 1px solid #111;
      background: #111;
      color: #fff;
      padding: 17px 36px;
      font-size: 12px;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .submit:hover {
      background: #fff;
      color: #111;
    }

    .submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      font-size: 13px;
      margin-top: 18px;
      line-height: 1.6;
    }

    /* 하단 연락처 */

    .info {
      border-top: 1px solid #ddd;
      margin-top: 120px;
      padding-top: 38px;
      font-size: 14px;
      line-height: 2.2;
    }

    .info a {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* 푸터 */

    footer {
      border-top: 1px solid #eee;
      padding: 30px 5%;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      font-size: 12px;
    }

    footer a {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* 모바일 */

    @media (max-width: 700px) {

      main {
        padding: 150px 6% 80px;
      }

      .eyebrow {
        margin-bottom: 35px;
      }

      .info {
        margin-top: 80px;
      }

      footer {
        flex-wrap: wrap;
      }

    }

/* =====================================
   CONTACT 페이지 컬러 통일

   배경색 : #F1F1F1
   글자색 : #939393
===================================== */

/* CONTACT 제목, 폼, 안내 문구, 연락처, 푸터 */
main,
main .eyebrow,
main label,
main .optional,
main .hint,
main .status,
main .info,
main .info a,
footer,
footer a {
  color: #939393;
}

/* 입력창 및 선택창 */
input,
select,
textarea {
  background: #F1F1F1;
  color: #939393;
  border-bottom-color: #939393;
}

/* 입력 전 안내 문구 */
input::placeholder,
textarea::placeholder {
  color: #939393;
  opacity: 1;
}

/* 입력창 클릭 시 구분선 */
input:focus,
select:focus,
textarea:focus {
  border-bottom-color: #939393;
}

/* 전송 버튼 */
.submit {
  background: #939393;
  color: #F1F1F1;
  border-color: #939393;
}

/* 전송 버튼 마우스 오버 */
.submit:hover {
  background: #F1F1F1;
  color: #939393;
}

/* 하단 연락처 구분선 */
.info {
  border-top-color: #939393;
}

/* 푸터 구분선 */
footer {
  border-top-color: #D8D8D8;
}

/* =====================================
   CONTACT - SEND INQUIRY 버튼

   기본 : 연회색 배경 + 회색 테두리/글자
   호버 : 회색 배경 + 밝은 글자
===================================== */

/* 기본 상태 */
.submit {
  display: inline-block;
  background: #F1F1F1;
  color: #939393;
  border: 1px solid #939393;

  padding: 17px 36px;
  font-size: 12px;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: background-color 0.2s ease, color 0.2s ease;
}

/* 마우스를 올렸을 때 */
.submit:hover:not(:disabled) {
  background: #939393;
  color: #F1F1F1;
  border-color: #939393;
}

/* 전송 중 비활성화 */
.submit:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
  </style>
</head>

<body>

  <!-- 공통 네비게이션 -->
  <div id="site-navigation"></div>

  <main>

    <!-- CONTACT 제목 -->
    <div class="eyebrow">
      04 / Contact.
    </div>

    <!-- 프로젝트 문의 폼 -->
    <form id="contact-form">

      <!-- 01. 브랜드명 -->
      <div class="field">
        <label for="brand">
          01. 브랜드명 / 회사명 *
        </label>

        <input
          id="brand"
          name="브랜드명/회사명"
          required
          placeholder="브랜드 또는 회사명을 입력해 주세요"
        >
      </div>

      <!-- 02. 담당자명 -->
      <div class="field">
        <label for="person">
          02. 담당자명 *
        </label>

        <input
          id="person"
          name="담당자명"
          required
          placeholder="성함을 입력해 주세요"
        >
      </div>

      <!-- 03. 이메일 -->
      <div class="field">
        <label for="email">
          03. 이메일 *
        </label>

        <input
          id="email"
          type="email"
          name="email"
          required
          placeholder="회신받을 이메일을 입력해 주세요"
        >
      </div>

      <!-- 04. 문의 분야 -->
      <div class="field">
        <label for="service">
          04. 문의 분야 *
        </label>

        <select
          id="service"
          name="문의 분야"
          required
        >
          <option value="" selected disabled>
            선택해 주세요
          </option>

          <option>Branding</option>
          <option>Marketing Strategy</option>
          <option>Lookbook & Campaign</option>
          <option>Content</option>
          <option>Influencer Marketing</option>
          <option>Pop-up & Experience</option>
          <option>Multiple Services / Other</option>
        </select>
      </div>

      <!-- 05. 예상 예산 -->
      <div class="field">
        <label for="budget">
          05. 예상 예산
          <span class="optional">(선택)</span>
        </label>

        <select
          id="budget"
          name="예상 예산"
        >
          <option>미정 / 협의</option>
          <option>100만 원 미만</option>
          <option>100~300만 원</option>
          <option>300~500만 원</option>
          <option>500~1,000만 원</option>
          <option>1,000만 원 이상</option>
        </select>
      </div>

      <!-- 06. 희망 일정 -->
      <div class="field">
        <label for="schedule">
          06. 희망 일정
          <span class="optional">(선택)</span>
        </label>

        <input
          id="schedule"
          name="희망 일정"
          placeholder="예: 2026년 12월 중 / 일정 협의"
        >
      </div>

      <!-- 07. 프로젝트 상세 -->
      <div class="field">
        <label for="message">
          07. 프로젝트 상세 내용 *
        </label>

        <textarea
          id="message"
          name="프로젝트 상세 내용"
          required
          placeholder="프로젝트 목적, 요청 업무, 참고사항 등을 자유롭게 작성해 주세요."
        ></textarea>
      </div>

      <!-- 개인정보 안내 -->
      <p class="hint">
        제출한 정보는 프로젝트 문의 확인 및 회신을 위해 사용됩니다.
        민감한 개인정보는 작성하지 말아 주세요.
      </p>

      <!-- 전송 버튼 -->
      <button
        class="submit"
        type="submit"
      >
        SEND INQUIRY ↗
      </button>

      <p
        class="status"
        id="status"
        role="status"
        aria-live="polite"
      ></p>

    </form>

    <!-- 연락처 정보 -->
    <section class="info">

      <div>
        Contact:
        <a href="mailto:ohv.agency@gmail.com">
          ohv.agency@gmail.com
        </a>
      </div>

      <div>
        Graphic Designer Gio, Marketer Sunny
      </div>

      <div>
        Edit Magazine
        <a
          href="https://www.instagram.com/nicemechew.mag/"
          target="_blank"
          rel="noopener noreferrer"
        >
          @nicemechew.mag
        </a>
      </div>

      <div>
        Based in South Korea.
      </div>

    </section>

  </main>

  <!-- 푸터 -->
  <footer>
    <span>
      © OHV AGENCY. ALL RIGHTS RESERVED.
    </span>

    <a
      href="https://www.instagram.com/ohv.agency/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Instagram ↗
    </a>
  </footer>

  <!-- Formspree 문의 전송 -->
  <script>
    const FORM_ENDPOINT = "https://formspree.io/f/mnppavzz";

    const form = document.getElementById("contact-form");
    const status = document.getElementById("status");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const button = form.querySelector('button[type="submit"]');

      button.disabled = true;
      status.textContent = "문의 내용을 전송 중입니다...";

      try {
        const response = await fetch(FORM_ENDPOINT, {
          method: "POST",
          body: new FormData(form),
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error("submission failed");
        }

        form.reset();

        status.textContent =
          "문의가 접수되었습니다. 감사합니다!";

      } catch (error) {

        status.textContent =
          "전송에 실패했습니다. 잠시 후 다시 시도하거나 이메일로 직접 문의해 주세요.";

      } finally {
        button.disabled = false;
      }
    });
  </script>

  <!-- 공통 네비게이션 기능 -->
  <script src="navigation.js"></script>

</body>
</html>
